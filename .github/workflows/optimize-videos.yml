name: Optimize portfolio videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download 1080p web masters for mobile encoding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web-master mobile-video
          gh release download v1.0.0 --dir web-master \
            --pattern laptop-web.mp4 \
            --pattern beauty-web.mp4 \
            --pattern hotpot-web.mp4 \
            --pattern fashion-transform-web.mp4 \
            --pattern fashion-split-web.mp4 \
            --pattern drama-web.mp4

      - name: Create 720p 60fps mobile versions
        shell: bash
        run: |
          set -euo pipefail
          encode_mobile_video() {
            ffmpeg -hide_banner -y -i "$1" \
              -map 0:v:0 -map '0:a:0?' \
              -vf "scale=w='if(gt(iw,ih),min(1280,iw),-2)':h='if(gt(iw,ih),-2,min(1280,ih))':force_original_aspect_ratio=decrease,fps=60" \
              -c:v libx264 -preset veryfast -crf 25 -maxrate 3.5M -bufsize 7M \
              -profile:v high -level 4.1 -pix_fmt yuv420p \
              -g 120 -keyint_min 120 -sc_threshold 0 \
              -c:a aac -b:a 96k -ac 2 \
              -movflags +faststart "$2"
          }

          encode_mobile_video web-master/laptop-web.mp4 mobile-video/laptop-mobile.mp4
          encode_mobile_video web-master/beauty-web.mp4 mobile-video/beauty-mobile.mp4
          encode_mobile_video web-master/hotpot-web.mp4 mobile-video/hotpot-mobile.mp4
          encode_mobile_video web-master/fashion-transform-web.mp4 mobile-video/fashion-transform-mobile.mp4
          encode_mobile_video web-master/fashion-split-web.mp4 mobile-video/fashion-split-mobile.mp4
          encode_mobile_video web-master/drama-web.mp4 mobile-video/drama-mobile.mp4

      - name: Verify mobile videos
        run: |
          for video in mobile-video/*.mp4; do
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
              -of default=noprint_wrappers=1 "$video"
          done

      - name: Upload mobile films to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 mobile-video/*.mp4 --clobber
